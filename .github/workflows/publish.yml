name: publish

# 发版通道：推 tag（v*）→ 这里用 OIDC（Trusted Publishing）发 npm，全程没有 token、不会过期。
# 本机 `npm run release` 默认就推 tag 走这条；带 `--local` 才退回本地 token 发布。
# 需要先在 npm 包设置 → Access → Trusted Publisher 里配好：GitHub Actions / 本仓库 / publish.yml。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm Trusted Publishing（OIDC）要这个

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: npm 要 11.5+ 才认 OIDC
        run: npm install -g npm@latest

      - name: 自检（不装 DSH、不开浏览器）
        run: node _publish-smoke.mjs

      - name: 发到 npm
        run: npm publish --access public --provenance

      - name: 确认线上 dist-tag
        run: |
          npm view "$(node -p "require('./package.json').name")" version
