name: publish

# 可选路线：本机 `npm run release` 是默认通道（本地直接 publish）。
# 这条只在手动触发时跑，用于「换机器 / 想走 OIDC 不带 token」的场合；
# 用之前要先在 npm 包设置里配好 Trusted Publisher（GitHub Actions: 本仓库 + publish.yml）。
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm Trusted Publishing（OIDC）要这个

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: npm 要 11.5+ 才认 OIDC
        run: npm install -g npm@latest

      - name: 自检（不装 DSH、不开浏览器）
        run: node _publish-smoke.mjs

      - name: 发到 npm
        run: npm publish --access public --provenance

      - name: 确认线上 dist-tag
        run: |
          npm view "$(node -p "require('./package.json').name")" version
